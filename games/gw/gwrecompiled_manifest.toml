# Codegen manifest for Geometry Wars: Retro Evolved, the arcade cabinet in Project Gotham Racing
# 4's garage (the disc's gw.xex). scripts/build.sh stages gw.xex in game-data/ and runs codegen in
# a copy of this folder.

[project]
name = "gwrecompiled"
game_root = "game-data"

[entrypoint]
file_path = "game-data/gw.xex"
out_directory_path = "generated/default"
includes = []
setjmp_address = 0x82107C60
longjmp_address = 0x82107820

# Function starts codegen does not find by itself, from MTR-PGR4's manifest (MIT,
# github.com/MissingThePixel/MTR-PGR4).
[entrypoint.functions]
0x82124F18 = {}
0x8211BC20 = {}
0x820915C0 = {}
0x820CD2D0 = {}
