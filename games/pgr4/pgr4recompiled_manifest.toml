# Codegen manifest for Project Gotham Racing 4, Title Update #2 (0.0.2.1). scripts/build.sh stages
# the disc's default.xex with the update's default.xexp beside it in game-data/, where codegen
# applies the patch, and runs codegen in a copy of this folder.

[project]
name = "pgr4recompiled"
game_root = "game-data"

[entrypoint]
file_path = "game-data/default.xex"
out_directory_path = "generated/default"
includes = []
# Register-as-local codegen: guest CR, CTR, XER and the non-volatile registers become C++ locals
# instead of PPCContext fields, and the register save/restore helper calls disappear (XenonRecomp's
# README; UnleashedRecomp's SWA.toml sets all eight options). Arguments and r1 stay in ctx.
# Measured on the race: -17.9 % frame time.
cr_as_local = true
ctr_as_local = true
xer_as_local = true
non_volatile_as_local = true
# The lwarx/ldarx reservation becomes a local. Every function in this game with a load-reserve
# also has its store-conditional (167 functions, none split), so the reservation never has to
# cross a call.
reserved_as_local = true
# The other three stay off, each because this game's code depends on what it removes:
# - skip_lr: two blrl sites branch to ctx.lr, and the garage collision hook identifies its caller
#   by the link register (mflr r12).
# - skip_msr: about 195 mtmsrd r13 ... mtmsrd interrupt-off regions guard shared data; they are
#   the REX_ENTER/LEAVE_GLOBAL_LOCK pairs.
# - non_argument_as_local: about 845 exception-handler funclets take their frame pointer in r12
#   (addi r31,r12,-N at entry), and some tail-branch chunks take r11 from the function that
#   branched to them; as locals those values would be lost.
setjmp_address = 0x828DE260
longjmp_address = 0x828DE7E0

# Function starts codegen does not find by itself: targets reached only through vtables, among
# them the this-adjusting thunks (addi r3,r3,-N; b). From PGR4-Recomp's manifest (MIT,
# github.com/beatrixzy/PGR4-Recomp), which runs on this title update, and entries found by
