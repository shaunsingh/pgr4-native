# Game patches, as mid-asm hooks (games/pgr4/src/pgr4_hooks.cpp). Each address is an instruction of
# Title Update #2; codegen emits the call before it, or after it with after_instruction.

# KickOffEx (sub_826CACA0) loads the presentation interval from the device (lwz r10,13580(r31)).
# The native renderer paces frames on the display, so the guest presents immediately.
[[entrypoint.midasm_hook]]
address = 0x826CAD54
name = "Pgr4PresentationIntervalHook"
registers = ["r10"]
after_instruction = true

# Motion blur pass (sub_82859FC0): fmuls f0,f0,f13 is the per-sample step (c159), tuned for 30 FPS.
[[entrypoint.midasm_hook]]
address = 0x8285A758
name = "Pgr4MotionBlurStepHook"
registers = ["f0"]
after_instruction = true

# Native 16:10 (development.md's "Native 16:10"): the device's presentation size, its front buffer
# and its depth buffer, hardcoded 1280x720 (sub_82317D48).
[[entrypoint.midasm_hook]]
address = 0x82317D98
name = "Pgr4RenderHeightHook"
registers = ["r11"]
after_instruction = true

[[entrypoint.midasm_hook]]
address = 0x82317E6C
name = "Pgr4RenderHeightHook"
registers = ["r4"]
after_instruction = true

[[entrypoint.midasm_hook]]
