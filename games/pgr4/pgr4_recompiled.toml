# Settings for pgr4_recompiled.exe, read from beside it at every start. A flag on the command line
# (Steam's launch options: `%command% --name=value`) overrides the same setting here.

# Window: 1280x800, the Steam Deck's panel. Elsewhere, set the display's own size. The game renders
# 16:9 and is shown letterboxed on other aspect ratios, never stretched.
window_width = 1280
window_height = 800
fullscreen = true

# The native D3D12 renderer presents the game, paced on the display: the display's refresh rate
# (and Steam's frame limit, if set) sets the frame rate.
pgr4_native = true
pgr4_native_primary = true

# The frame rate unlocked from the console's 30 (the game's presentation interval). The garage
# walking fix follows it.
pgr4_60fps = true

# At least 16x anisotropic filtering on the game's mipmapped, linearly filtered textures.
pgr4_native_anisotropy = 16

# Samples per pixel of the 3D scene's MSAA: 1 (none), 2 (the game's own), 4 or 8. More samples
# give smoother edges for more GPU time; 4x holds 90 fps on a Steam Deck OLED.
pgr4_native_msaa = 4

# The 3D scene with MSAA, or (true) antialiased and upscaled to the render height (800) by AMD's
# FidelityFX Super Resolution, or what OptiScaler puts behind it (README.md, "Upscaling"). The
# upscaler renders the scene at width x height: 1280x800 is antialiasing only, 853x533 FSR's
# Quality, 640x400 its Performance.
pgr4_native_upscaler = false
pgr4_native_upscaler_width = 1280
pgr4_native_upscaler_height = 800
# A frame rate (90: the Steam Deck OLED's) has the upscaler lower its render size each frame, down
# to a height of pgr4_native_upscaler_min_height, while the GPU falls behind it, or behind the lower
# frame rate the frames are shown at (pgr4_native_present_interval, frame generation). 0: a fixed
# size.
pgr4_native_upscaler_target_fps = 0
pgr4_native_upscaler_min_height = 360

# F7 switches the scene between MSAA and the upscaler, and F8 shows the upscaler's debug view, so
# the achievements overlay moves to F6.
bind_achievements = "F6"

# Runtime settings.
execute_unclipped_draw_vs_on_cpu = true
gpu_plugin = "xenos"
d3d12_present_vsync = true
gpu_vblank_deadline_timer = true
gpu_wait_reg_mem_high_res = true
clear_memory_page_state = false
gpu_ring_wake_fast = true
texture_cache_memory_limit_soft_lifetime = 30

# Errors only, in logs/ beside the executable ("warn" or "info" for a bug report).
log_level = "error"
