name: release

on:
  push:
    tags: ['v*']
  # A dry run: the same build and package, kept as a workflow artifact instead of a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    # The toolchain the Deck builds with (pgr4dev, Arch): the Arch Linux Archive's packages of
    # 2026-10-21, clang/lld/llvm/compiler-rt 23.1.3, cmake 4.4.4, ninja 1.13.2, Python 3.14.8.
    container: archlinux:base
    steps:
      - name: Toolchain
        run: |
          echo 'Server = https://archive.archlinux.org/repos/2026/10/21/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed clang lld llvm compiler-rt cmake ninja python git rsync openssh \
            pkgconf libx11 wayland
          clang-cl --version | head -1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Game files, never public: a private repository read through a read-only deploy key.
      - uses: actions/checkout@v4
        with:
          repository: shaunsingh/pgr4-native-ci-inputs
          ssh-key: ${{ secrets.CI_INPUTS_DEPLOY_KEY }}
          path: ci-inputs

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/xwin
          key: xwin-${{ hashFiles('build/fetch-xwin.sh') }}

      - name: MSVC CRT and Windows SDK
        run: build/fetch-xwin.sh "$RUNNER_TEMP/xwin"

      - name: Build
        env:
          XWIN_DIR: ${{ runner.temp }}/xwin
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          native/build.sh --dest "$RUNNER_TEMP/build" --game ci-inputs/game \
            --update ci-inputs/title-update --pgo ci-inputs/pgo/default.profdata --jobs "$(nproc)"

      - name: Package
        run: native/tools/package_release.py --dest "$RUNNER_TEMP/build" --version "$GITHUB_REF_NAME" --out out

      - name: Artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: out/
          retention-days: 7

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pacman -S --noconfirm --needed github-cli
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file native/release/README.md out/*.zip out/*.zip.sha256
