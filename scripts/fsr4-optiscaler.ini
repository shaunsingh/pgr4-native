; OptiScaler settings for play.sh --fgmod, over ~/fgmod/OptiScaler.ini (key=value, one per line).
; The game's FidelityFX API calls go to FSR 4 (UpscalerIndex 0) with the INT8 Lite model, which
; AMD's amdxcffx64.dll 4.1.2 beside the executable has; OptiScaler answers its GPU query as a
; Lite GPU (Fsr4GpuSupport 4). No frame generation, no Nvidia spoofing, and a log in the runtime
; folder (OptiScaler.log). Fsr4EnableWatermark=true shows the model AMD's library runs.
Dx12Upscaler=ffx
UpscalerIndex=0
Fsr4GpuSupport=4
Fsr4Model=3
Fsr4EnableWatermark=false
FGInput=nofg
FGOutput=nofg
Dxgi=false
UseHQFont=false
LogToFile=true
LogLevel=2
