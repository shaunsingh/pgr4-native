; HelixSR Scaler settings for play.sh, over its own OptiScaler.ini (key=value, one per line).
; The game's FidelityFX API calls go to OptiScaler's DLSS upscaler, which HelixSR Scaler runs as
; HLX DLSS on GPUs without DLSS (HelixSR\helixsr.dll beside the executable). No frame generation
; of OptiScaler's (the game's own runs through it), no Nvidia spoofing, and a log of warnings and
; errors in the runtime folder (OptiScaler.log).
Dx12Upscaler=dlss
FGInput=nofg
FGOutput=nofg
Dxgi=false
UseHQFont=false
LogToFile=true
LogLevel=3
